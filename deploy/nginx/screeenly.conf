# nginx configuration for screeenly.com
#
# The website is served over HTTPS only. The API and the screenshot files stay
# reachable over plain HTTP, because existing integrations call
# http://screeenly.com/api/... and most of them do not follow redirects (and a
# redirect turns a POST into a GET, which breaks the call).
#
# Adjust before use:
#   - server_name and the certificate paths (the paths below are the ones
#     certbot creates)
#   - the root path
#   - the PHP-FPM socket
#
# Deploy: copy to /etc/nginx/sites-available/screeenly.conf, link it into
# sites-enabled, run `nginx -t`, then `systemctl reload nginx`.

# -----------------------------------------------------------------------------
# HTTP (port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name screeenly.com www.screeenly.com;

    root /var/www/screeenly/public;
    index index.php;

    # Let's Encrypt HTTP-01 challenges must work over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    # Existing API integrations: serve the request, do not redirect.
    # A separate log shows who still calls the API over HTTP, so you can
    # contact them before you ever turn this off.
    location ^~ /api/ {
        access_log /var/log/nginx/screeenly-api-http.log;

        try_files $uri /index.php?$query_string;
    }

    # Screenshot files returned by the API (the "path" field). Clients fetch
    # them with whatever scheme they got, or with the one they hardcoded.
    location ^~ /storage/ {
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Only index.php is an entry point.
        if ($uri !~ "^/index\.php$") {
            return 404;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Everything else (website, login, dashboard) goes to HTTPS.
    # 301 is fine here because browsers send GET for these pages.
    location / {
        return 301 https://screeenly.com$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (port 443)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name screeenly.com www.screeenly.com;

    ssl_certificate     /etc/letsencrypt/live/screeenly.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screeenly.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Send www to the bare domain.
    if ($host = www.screeenly.com) {
        return 301 https://screeenly.com$request_uri;
    }

    # Browsers remember to use HTTPS for the website. API clients ignore this
    # header, so it does not affect existing integrations.
    # Do not add "includeSubDomains" or "preload" unless every subdomain
    # supports HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/screeenly/public;
    index index.php;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        if ($uri !~ "^/index\.php$") {
            return 404;
        }

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
